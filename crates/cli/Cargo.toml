[package]
name = "wowcoach"
description = "WoW combat log analyzer that suggests improvements for Mythic+ and raid, at group and individual level"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["warcraft", "combat-log", "mythic-plus", "raid", "analysis"]
categories = ["command-line-utilities", "games"]

[dependencies]
wowcoach-core = { path = "../core", default-features = false }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[features]
default = ["wcl"]
wcl = ["wowcoach-core/wcl"]
