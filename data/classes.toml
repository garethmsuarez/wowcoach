# Class abilities that matter for coaching: interrupts, crowd control that
# stops casts, defensives and dispels. Expansion data (Midnight, 12.x), not
# season data. Compiled into wowcoach.
#
# One [[ability]] per (ability, kind). `ids` lists every spell ID the ability
# shows up under: the cast, and sometimes a separate ID for its effect (e.g.
# Skull Bash is cast as 106839 but interrupts as 93985). `specs` empty = every
# spec of the class. class = "Racial" for racial abilities.
#
#   kind = "interrupt"  range_yd (5 = melee)  cd_s
#   kind = "stop"       cc = stun | incapacitate | disorient | fear | knock | silence
#                       aura_ids = the debuff(s) it shows up as on the target,
#                       when they differ from ids (Shockwave: cast 46968, stun 132168)
#   kind = "defensive"  scope = personal | external | group
#   kind = "dispel"     types = [magic, curse, poison, disease, bleed, enrage]
#                       target = friendly | enemy
#   cdr = true          talents routinely cut the cooldown a lot; the log audit
#                       doesn't check its reuse
#   situational = true  (stops) credited when it lands, never suggested as
#                       available: a damage cooldown that happens to stun, or a
#                       stun with a condition the log can't show (stealth)
#
# Cooldowns are base values; talents can shorten them. For "was a defensive
# available?" rules a base cooldown errs on the side of not blaming players.
# Validate: wowcoach classes check [--live] [LOGS...]
# "seen in logs" = confirmed by SPELL_INTERRUPT / SPELL_DISPEL in local logs, 2026-11.
# Warlock pet abilities: the spell API doesn't list pet spells. Spell Lock and
# Singe Magic (132411) are confirmed from public keys (`classes check --wcl`);
# Axe Toss and Devour Magic are not yet.

