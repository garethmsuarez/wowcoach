# Season data pack: Midnight Season 2 (M+ dungeons and the current raid tier).
#
# Compiled into wowcoach. IDs are filled by `wowcoach season sync` (Blizzard API)
# and `wowcoach season suggest` (combat logs, Warcraft Logs). Only `tags` drive
# coaching rules, and they are set by a reviewer, never by a tool. `suggested`
# holds tool proposals awaiting review.
#
# Tags: priority_kick, stoppable, avoidable, dispel_priority, tank_buster,
#       dangerous_cast, affix
# [[affix]]: keystone affixes by logged ID. `name` comes from `season sync`;
#   `death_penalty_s` (seconds a death costs the timer) is set by a reviewer,
#   measured from logged key times (docs/milestones/m4-dispels-and-affixes.md).
# Spells may carry `dispel = [types]` (data written by `season suggest`) and
#   `affixes = [ids]` (with map_id = 0) for affix mechanics.
# Format and workflow: docs/milestones/m1-season-data.md
# Validate with: wowcoach season check data/seasons/midnight-s2.toml

